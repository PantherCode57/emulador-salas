name: Nintendo DS Lite

# Panther OS para la Nintendo DS Lite (la carpeta «Nintendo DS Lite»): el puente (Go) con sus pruebas,
# la prueba de la DS en el PC (que habla de verdad con el puente, con un WhatsApp de mentira) con
# fotos de todas las pantallas, y panther.nds para la tarjeta de la flashcard, con BlocksDS.
on:
  push:
    branches: [desarrollo, master]
    paths:
      - "Nintendo DS Lite/**"
      - ".github/workflows/nintendo-ds.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ds:
    name: Panther OS para la DS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "Nintendo DS Lite/letras/go.mod"
          cache-dependency-path: |
            Nintendo DS Lite/letras/go.sum
            Nintendo DS Lite/puente/go.sum
      - name: Copiar la carpeta (make no se lleva bien con los espacios del nombre)
        run: cp -r "Nintendo DS Lite" /tmp/ds
      - name: Dibujar las letras
        working-directory: /tmp/ds/letras
        run: go run -mod=mod . -salida ../generado/letras.c
      - name: El puente
        working-directory: /tmp/ds/puente
        run: |
          go vet ./...
          go test ./...
          go build -trimpath -o /tmp/puente-ds .
      - name: Probar en el PC (y sacar fotos de las pantallas)
        working-directory: /tmp/ds
        run: |
          gcc -std=gnu11 -O1 -g -Wall -Werror -Wno-format-truncation -fsanitize=address,undefined -fno-sanitize-recover=all \
            source/*.c generado/letras.c pc/prueba.c -lm -o prueba
          /tmp/puente-ds -falso -sin-vincular -codigo 123456 -datos /tmp/puente-datos > puente.txt 2>&1 &
          PUENTE=$!
          sleep 1
          ./prueba fotos tarjeta | tee prueba.txt
          kill $PUENTE || true
          echo "--- registro del puente:"
          cat puente.txt
          grep -q "prueba ds: todo bien" prueba.txt
          grep -q 'VINCULAR 34612345678' puente.txt
          grep -q 'ENVIADO 111@s.whatsapp.net "hola"' puente.txt
          grep -q 'ENVIADO 111@s.whatsapp.net "Vale"' puente.txt
      - name: Compilar para la DS (BlocksDS)
        working-directory: /tmp/ds
        run: |
          docker run --rm -v /tmp/ds:/work -w /work skylyrac/blocksds:slim-v1.25.0 make -j4
          ls -la panther.nds
      - name: Comprobar la cabecera (0x200 y solo DS, para las flashcards antiguas)
        working-directory: /tmp/ds
        run: |
          python3 - <<'FIN'
          import struct
          b = open("panther.nds", "rb").read()
          unidad, cabecera = b[0x12], struct.unpack_from("<I", b, 0x84)[0]
          a9 = struct.unpack_from("<4I", b, 0x20)
          a7 = struct.unpack_from("<4I", b, 0x30)
          print("unidad %d, cabecera %#x, arm9 %s, arm7 %s" % (unidad, cabecera, [hex(x) for x in a9], [hex(x) for x in a7]))
          assert unidad == 0 and cabecera == 0x200, "la cabecera no es la de las flashcards antiguas"
          FIN
      - uses: actions/upload-artifact@v4
        with:
          name: panther-ds
          path: |
            /tmp/ds/panther.nds
            /tmp/ds/fotos/
