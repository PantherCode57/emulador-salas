name: Puente DS (Android)

# La app de Android con el puente de Panther OS para la Nintendo DS Lite («Nintendo DS Lite/android»,
# que lleva «Nintendo DS Lite/puente» compilado para cada tipo de móvil). Se prueba en un emulador de
# Android con el WhatsApp de mentira: se le habla como la DS, por TCP y cifrado.
on:
  push:
    branches: [desarrollo]
    paths:
      - "Nintendo DS Lite/puente/**"
      - "Nintendo DS Lite/android/**"
      - ".github/workflows/nintendo-ds-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Compilar el APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "Nintendo DS Lite/puente/go.mod"
          cache-dependency-path: "Nintendo DS Lite/puente/go.sum"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: El puente para cada tipo de móvil (64 bits, 32 bits y el emulador)
        working-directory: "Nintendo DS Lite/puente"
        run: |
          set -e
          go vet ./...
          go test ./...
          J=../android/app/src/main/jniLibs
          for x in "arm64-v8a arm64" "armeabi-v7a arm" "x86_64 amd64"; do
            set -- $x
            mkdir -p "$J/$1"
            GOOS=linux GOARCH=$2 GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$J/$1/libpuente.so" .
          done
          ls -la $J/*
          go test -c -o /tmp/puente.test .
      - name: APK
        run: |
          chmod +x gradlew
          ./gradlew -p "Nintendo DS Lite/android" assembleDebug --no-daemon
          ls -la "Nintendo DS Lite/android/app/build/outputs/apk/debug/"
      - uses: actions/upload-artifact@v4
        with:
          name: puente-ds-apk
          path: |
            Nintendo DS Lite/android/app/build/outputs/apk/debug/*.apk
            /tmp/puente.test

  prueba:
    name: Probar en un emulador de Android
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: puente-ds-apk
          path: piezas
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          find piezas -type f | xargs ls -la
          chmod +x "$(find piezas -name puente.test)"
      - name: Probar
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash "Nintendo DS Lite/android/prueba.sh" "$(find piezas -name '*.apk' | head -n 1)" "$(find "$PWD/piezas" -name puente.test | head -n 1)" resultados
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puente-ds-prueba
          path: resultados/
