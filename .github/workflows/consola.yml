name: Consola portátil (arm64)

# Programas de la consola portátil (consola/): el WhatsApp, Spotin, YouTube, Instagram, Claude,
# Duolingo, Ajedrez, Zarpa, el Navegador, la Panther Store, Pokémon con su enlace, la Pokédex, la
# animación de arranque, el núcleo de la pantalla (lakka/nucleo) y el mGBA de Pokemulador (scripts
# de Lua para GBA-PK), compilados en una máquina arm64 de GitHub. Ninguno lleva claves: el enlace de
# la consola entra en Tailscale con la cuenta de quien la usa (un QR la primera vez).
#
# Al subir a «desarrollo», el trabajo «release» deja las apps en la release «panther-apps» (de
# prueba, nunca la «latest»), con tienda.json (tamaño y sha256 de cada pieza). De ahí las baja la
# Panther Store de la consola, que también se baja a sí misma si hay otra versión. La crea y la pone
# al día GITHUB_TOKEN, así que su etiqueta no lanza publish.yml (lo que hace GITHUB_TOKEN no arranca
# otros flujos).
on:
  push:
    branches-ignore: [ master ]
    paths:
      - 'consola/**'
      - 'lakka/nucleo/**'
      - 'nucleos/mgba/**'
      - 'lakka/nucleos/mgba-linux.sh'
      - 'terceros/gba-pk/**'
      - 'Nintendo DS Lite/**'
      - '.github/workflows/consola.yml'
  workflow_dispatch:

env:
  MGBA_TAG: "0.10.5"
  LUA_VERSION: "5.4.7"

jobs:
  programas:
    name: WhatsApp, animación y núcleo de la pantalla
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: consola/whatsapp/go.mod
          cache-dependency-path: |
            consola/whatsapp/go.sum
            consola/spotin/go.sum
            consola/enlace/go.sum
            consola/pokemon/go.sum
            consola/youtube/go.sum
            consola/navegador/go.sum
            consola/instagram/go.sum
            consola/claude/go.sum
            consola/duolingo/go.sum
            consola/ajedrez/go.sum
            consola/zarpa/go.sum
            consola/tienda/go.sum
            consola/pokedex/go.sum
            consola/pasards/go.sum
      - name: WhatsApp
        working-directory: consola/whatsapp
        run: |
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../piezas/whatsapp .
          ../../piezas/whatsapp -prueba ../../piezas/pantallas
      - name: Spotin
        working-directory: consola/spotin
        run: |
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../piezas/spotin .
          ../../piezas/spotin -prueba ../../piezas/pantallas-spotin
      - name: YouTube
        working-directory: consola/youtube
        run: |
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../piezas/youtube .
          ../../piezas/youtube -prueba ../../piezas/pantallas-youtube
      - name: Navegador
        working-directory: consola/navegador
        run: |
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../piezas/navegador .
          ../../piezas/navegador -prueba ../../piezas/pantallas-navegador
      - name: Instagram
        working-directory: consola/instagram
        run: |
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../piezas/instagram .
          ../../piezas/instagram -prueba ../../piezas/pantallas-instagram
      - name: Claude
        working-directory: consola/claude
        run: |
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../piezas/claude .
          ../../piezas/claude -prueba ../../piezas/pantallas-claude
      - name: Duolingo
        working-directory: consola/duolingo
        run: |
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../piezas/duolingo .
          ../../piezas/duolingo -prueba ../../piezas/pantallas-duolingo
      - name: Ajedrez
        working-directory: consola/ajedrez
        run: |
          go vet ./...
          go test ./...
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../piezas/ajedrez .
          ../../piezas/ajedrez -prueba ../../piezas/pantallas-ajedrez
      - name: Zarpa
        working-directory: consola/zarpa
        run: |
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../piezas/zarpa .
          ../../piezas/zarpa -prueba ../../piezas/pantallas-zarpa
      - name: Panther Store
        working-directory: consola/tienda
        run: |
          go vet ./...
          go test ./...
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../piezas/tienda .
          ../../piezas/tienda -prueba ../../piezas/pantallas-tienda
      - name: Pokémon (salas de Pokemulador)
        working-directory: consola/pokemon
        run: |
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../piezas/pokemon .
          ../../piezas/pokemon -prueba ../../piezas/pantallas-pokemon
      - name: Pokédex
        working-directory: consola/pokedex
        run: |
          go vet ./...
          go test ./...
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../piezas/pokedex .
          ../../piezas/pokedex -prueba ../../piezas/pantallas-pokedex
      - name: Pasar a la DS
        working-directory: consola/pasards
        run: |
          go vet ./...
          go test ./...
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../piezas/pasards .
          ../../piezas/pasards -prueba ../../piezas/pantallas-pasards
      - name: Enlace de las salas (sin clave)
        working-directory: consola/enlace
        run: |
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../piezas/enlace .
      - name: Animación de arranque
        working-directory: consola/arranque
        run: |
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../piezas/panther-arranque .
      - name: Núcleo de la pantalla
        run: |
          bash lakka/nucleo/compilar.sh
          cp lakka/nucleo/pokemulador_libretro.so piezas/
      - name: Instalación
        run: |
          cp consola/instalar/* piezas/
          mkdir -p piezas/pokemon-lua
          cp terceros/gba-pk/*.lua consola/trucos/caramelos-frlg.lua piezas/pokemon-lua/
      - uses: actions/upload-artifact@v4
        with:
          name: consola-arm64
          path: piezas/
          retention-days: 7

  emulador:
    name: Emulador de Panther OS (GB, GBC y GBA con mGBA dentro) para arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev zlib1g-dev libdrm-dev > /dev/null
      - name: Código de mGBA y de Lua
        run: |
          mkdir -p fuera && cd fuera
          curl -fsSL "https://github.com/mgba-emu/mgba/archive/refs/tags/${MGBA_TAG}.tar.gz" -o mgba.tar.gz
          curl -fsSL "https://www.lua.org/ftp/lua-${LUA_VERSION}.tar.gz" -o lua.tar.gz
          if [ "$LUA_VERSION" = "5.4.7" ]; then
            echo "9fbf5e28ef86c69858f6d3d34eccc32e911c1a28b4120ff3e84aaa70cfbf1e30  lua.tar.gz" | sha256sum -c -
          fi
          tar xzf mgba.tar.gz && tar xzf lua.tar.gz
      - name: mGBA y Lua
        working-directory: fuera
        run: MGBA=$PWD/mgba-${MGBA_TAG} LUA=$PWD/lua-${LUA_VERSION} bash ../consola/emulador/compilar_mgba.sh
      - name: Emulador
        working-directory: consola/emulador
        run: make MGBA=$GITHUB_WORKSPACE/fuera/mgba-lib
      # Las salas de GBA (GBA-PK) son un script de Lua con red: se prueba que el emulador lo carga, lo
      # llama en cada imagen y le deja usar sockets. El «juego» es una ROM mínima hecha aquí (un bucle).
      - name: Probar los scripts de Lua (salas de GBA)
        working-directory: consola/emulador
        run: |
          python3 -c "r=bytearray(0x400); r[0:4]=(0xEAFFFFFE).to_bytes(4,'little'); r[0xB2]=0x96; open('/tmp/prueba.gba','wb').write(r)"
          cat > /tmp/prueba.lua <<'EOF'
          local srv = assert(socket.bind(nil, 47123))
          assert(srv:listen())
          local cli = assert(socket.connect("127.0.0.1", 47123))
          local acc = assert(srv:accept())
          assert(cli:send("hola"))
          local n = 0
          callbacks:add("frame", function()
          	n = n + 1
          	if n == 10 then console:error("prueba: recibido " .. tostring(acc:receive(4))) end
          end)
          console:error("prueba: emu " .. tostring(emu ~= nil) .. ", juego " .. tostring(emu:getGameCode()))
          EOF
          ./emulador --medir 30 --script /tmp/prueba.lua /tmp/prueba.gba 2>&1 | tee /tmp/prueba.txt
          grep -q "prueba.lua: en marcha" /tmp/prueba.txt
          grep -q "prueba: emu true" /tmp/prueba.txt
          grep -q "prueba: recibido hola" /tmp/prueba.txt
      - name: Probar el combate a medias de GBA-PK (si tu amigo se va, se acaba solo)
        working-directory: consola/emulador
        run: |
          ./emulador --medir 300 --script pruebas/combate_solo.lua --script ../../terceros/gba-pk/pokemulador_final.lua /tmp/prueba.gba 2>&1 | tee /tmp/combate.txt
          grep -q "pokemulador_final.lua: en marcha" /tmp/combate.txt
          grep -q "prueba combate: todo bien" /tmp/combate.txt
      - name: Captura de pantalla
        working-directory: consola/captura
        run: gcc -O2 -Wall -o captura captura.c $(pkg-config --cflags --libs libdrm) -lz
      - uses: actions/upload-artifact@v4
        with:
          name: consola-emulador-arm64
          path: |
            consola/emulador/emulador
            consola/captura/captura
          retention-days: 7

  mgba:
    name: mGBA de Pokemulador (GBA-PK) para arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Buscar núcleo ya compilado
        id: cache
        uses: actions/cache@v4
        with:
          path: nucleo-mgba-linux
          key: consola-mgba-${{ env.MGBA_TAG }}-${{ env.LUA_VERSION }}-${{ hashFiles('nucleos/mgba/**', 'lakka/nucleos/mgba-linux.sh') }}
      - name: Descargar mGBA
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: mgba-emu/mgba
          ref: ${{ env.MGBA_TAG }}
          path: mgba
      - name: Compilar
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build > /dev/null
          bash lakka/nucleos/mgba-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: consola-mgba-arm64
          path: nucleo-mgba-linux/mgba_libretro.so
          retention-days: 7

  nds:
    name: Panther OS para la Nintendo DS Lite (panther.nds, para «Pasar a la DS»)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "Nintendo DS Lite/letras/go.mod"
          cache-dependency-path: "Nintendo DS Lite/letras/go.sum"
      - name: Compilar panther.nds (como nintendo-ds.yml)
        run: |
          set -euo pipefail
          cp -r "Nintendo DS Lite" /tmp/ds
          (cd /tmp/ds/letras && go run -mod=mod . -salida ../generado/letras.c)
          docker run --rm -v /tmp/ds:/work -w /work skylyrac/blocksds:slim-v1.25.0 make -j4
          mkdir -p piezas-nds
          cp /tmp/ds/panther.nds piezas-nds/
          ls -la piezas-nds
      - uses: actions/upload-artifact@v4
        with:
          name: consola-nds
          path: piezas-nds/
          retention-days: 7

  release:
    name: Apps para la Panther Store (release «panther-apps»)
    if: github.event_name == 'push' && github.ref == 'refs/heads/desarrollo'
    needs: [ programas, mgba, emulador, nds ]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: release-panther-apps
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ETIQUETA: panther-apps
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: consola-arm64
          path: piezas
      - uses: actions/download-artifact@v4
        with:
          name: consola-mgba-arm64
          path: piezas
      # El emulador de Panther no es una app de la tienda: lo baja Pokemon.sh si el que hay en la
      # consola es el que salió sin scripts de Lua.
      - uses: actions/download-artifact@v4
        with:
          name: consola-emulador-arm64
          path: piezas-emulador
      - uses: actions/download-artifact@v4
        with:
          name: consola-nds
          path: piezas-nds
      - name: Piezas con el nombre que busca la tienda
        run: |
          set -euo pipefail
          mkdir subir
          # Los nombres son los de «pieza.nombre» en consola/tienda/catalogo.go.
          # «tienda» es la propia Panther Store: se la baja ella misma al abrirse si es otra.
          for n in whatsapp claude instagram duolingo ajedrez zarpa youtube spotin pokemon pokedex navegador pasards \
                   tienda enlace pokemulador_libretro.so mgba_libretro.so \
                   WhatsApp.sh Claude.sh Instagram.sh Duolingo.sh Ajedrez.sh Zarpa.sh Youtube.sh \
                   Spotin.sh Pokemon.sh Pokedex.sh Navegador.sh PasarDS.sh; do
            cp "piezas/$n" subir/
          done
          cp piezas/pokemon-lua/*.lua subir/
          cp piezas-emulador/emulador/emulador subir/emulador
          cp piezas-nds/panther.nds subir/panther.nds
          for f in subir/*; do
            printf '%s\t%s\t%s\n' "$(basename "$f")" "$(stat -c %s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
          done > lista.tsv
          jq -Rn --arg v "${GITHUB_SHA::12}" --arg f "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $v, fecha: $f, piezas: ([inputs | split("\t") | {(.[0]): {tam: (.[1] | tonumber), sha256: .[2]}}] | add)}' \
            < lista.tsv > tienda.json
          cat tienda.json
      - name: Subir las que han cambiado y, al final, tienda.json
        run: |
          set -euo pipefail
          if ! gh release view "$ETIQUETA" > /dev/null 2>&1; then
            gh release create "$ETIQUETA" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Apps de Panther OS" \
              --notes "Las apps de la consola portátil para la Panther Store. La pone al día la compilación de la consola (consola.yml) en cada subida a desarrollo; no hace falta bajarlas a mano."
          fi
          gh release view "$ETIQUETA" --json assets -q '.assets[].name' > hay.txt
          gh release download "$ETIQUETA" -p tienda.json -O viejo.json 2> /dev/null || echo '{}' > viejo.json
          for f in subir/*; do
            n=$(basename "$f")
            antes=$(jq -r --arg n "$n" '.piezas[$n].sha256 // ""' viejo.json)
            ahora=$(jq -r --arg n "$n" '.piezas[$n].sha256' tienda.json)
            if [ "$antes" != "$ahora" ] || ! grep -qxF "$n" hay.txt; then
              echo "sube $n"
              gh release upload "$ETIQUETA" "$f" --clobber
            fi
          done
          gh release upload "$ETIQUETA" tienda.json --clobber
