name: Pokemulador USB (Lakka)

# Sistema de arranque para la memoria USB: Lakka recortado (solo Game Boy, GBA, DS y 3DS) que
# arranca en la pantalla de salas de Pokemulador. Piezas:
#   1. mGBA con scripts de Lua (GBA-PK) para Linux x86_64.
#   2. Azahar con las salas de Pokemulador para Linux x86_64 (tarda: se guarda en caché).
#   3. El enlace (pc/enlace), el servicio de salas (lakka/servicio) y el núcleo de la pantalla
#      (lakka/nucleo).
#   4. La imagen: Lakka 6.1 recortado con todo lo anterior (lakka/imagen/construir.sh).
#   5. Una prueba: arranca la imagen en QEMU, crea una sala, abre un juego y saca capturas.
# Todo se compila en Ubuntu 22.04 porque Lakka 6.1 trae glibc 2.38.
on:
  push:
    branches-ignore: [ master ]
    paths:
      - 'lakka/**'
      - '.github/workflows/lakka.yml'
      - 'pc/enlace/**'
      - 'nucleos/**'
      - 'terceros/gba-pk/**'
  workflow_dispatch:

env:
  LAKKA_VERSION: "6.1"
  AZAHAR_TAG: "2126.2"
  MGBA_TAG: "0.10.5"
  LUA_VERSION: "5.4.7"

jobs:
  nucleo-mgba:
    name: mGBA (GBA-PK) para Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Buscar núcleo ya compilado
        id: cache
        uses: actions/cache@v4
        with:
          path: nucleo-mgba-linux
          key: lakka-mgba-${{ env.MGBA_TAG }}-${{ env.LUA_VERSION }}-${{ hashFiles('nucleos/mgba/**', 'lakka/nucleos/mgba-linux.sh') }}
      - name: Descargar mGBA
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: mgba-emu/mgba
          ref: ${{ env.MGBA_TAG }}
          path: mgba
      - name: Compilar
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build > /dev/null
          bash lakka/nucleos/mgba-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lakka-mgba
          path: nucleo-mgba-linux/mgba_libretro.so
          retention-days: 7

  nucleo-azahar:
    name: Azahar (salas) para Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - name: Buscar núcleo ya compilado
        id: cache
        uses: actions/cache@v4
        with:
          path: nucleo-azahar-linux
          key: lakka-azahar-${{ env.AZAHAR_TAG }}-${{ hashFiles('nucleos/azahar/**', 'lakka/nucleos/azahar_entorno.py') }}
      - name: Descargar Azahar
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: azahar-emu/azahar
          ref: ${{ env.AZAHAR_TAG }}
          submodules: recursive
          path: azahar
      - name: Añadir salas y compilar
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgl-dev libegl-dev > /dev/null
          python3 nucleos/azahar/aplicar.py azahar
          python3 lakka/nucleos/azahar_entorno.py azahar
          cd azahar
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 \
            -DENABLE_LIBRETRO=ON -DENABLE_TESTS=OFF -DENABLE_LTO=OFF -DCITRA_WARNINGS_AS_ERRORS=OFF \
            "-DCMAKE_SHARED_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
          cmake --build build --target azahar_libretro -j $(nproc)
          SO=$(find build -name 'azahar_libretro*.so' | head -1)
          echo "Núcleo: $SO"
          strip -s "$SO"
          mkdir -p ../nucleo-azahar-linux
          cp "$SO" ../nucleo-azahar-linux/azahar_libretro.so
          objdump -T ../nucleo-azahar-linux/azahar_libretro.so | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -3
      - uses: actions/upload-artifact@v4
        with:
          name: lakka-azahar
          path: nucleo-azahar-linux/azahar_libretro.so
          retention-days: 7

  programas:
    name: Enlace, servicio y pantalla de salas
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pc/enlace/go.mod
          cache-dependency-path: |
            pc/enlace/go.sum
            lakka/servicio/go.mod
      - name: Enlace
        run: |
          mkdir -p piezas
          cd pc/enlace
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../piezas/enlace .
      - name: Servicio de salas
        env:
          CLAVE: ${{ secrets.POKEMULADOR_TS_KEY }}
        run: |
          cd lakka/servicio
          go mod tidy
          gofmt -l . ; gofmt -w .
          go vet ./...
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.claveTailscale=$CLAVE" -o ../../piezas/pokemulador-usb .
      - name: Pantalla de salas (núcleo)
        run: |
          bash lakka/nucleo/compilar.sh
          cp lakka/nucleo/pokemulador_libretro.so lakka/nucleo/pokemulador_libretro.info lakka/nucleo/azahar_libretro.info piezas/
          cp terceros/gba-pk/GBA-PK_Multiplayer.lua terceros/gba-pk/pokemulador_final.lua piezas/
          cp terceros/gba-pk/LICENSE.md piezas/LICENSE-GBA-PK.md
          ls -la piezas
      - uses: actions/upload-artifact@v4
        with:
          name: lakka-programas
          path: piezas/
          retention-days: 7

  imagen:
    name: Imagen del USB
    needs: [ nucleo-mgba, nucleo-azahar, programas ]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools syslinux syslinux-common mtools gdisk dosfstools > /dev/null
      - name: Lakka en caché
        id: lakka
        uses: actions/cache@v4
        with:
          path: Lakka-Generic.x86_64-${{ env.LAKKA_VERSION }}.img.gz
          key: lakka-imagen-${{ env.LAKKA_VERSION }}
      - name: Descargar Lakka
        if: steps.lakka.outputs.cache-hit != 'true'
        run: |
          f=Lakka-Generic.x86_64-${LAKKA_VERSION}.img.gz
          curl -fL --retry 3 -o "$f" "https://le.builds.lakka.tv/Generic.x86_64/$f"
          curl -fsL -o "$f.sha256" "https://le.builds.lakka.tv/Generic.x86_64/$f.sha256"
          [ "$(cut -d' ' -f1 $f.sha256)" = "$(sha256sum $f | cut -d' ' -f1)" ] || { echo "sha256 no coincide"; exit 1; }
          rm "$f.sha256"
      - uses: actions/download-artifact@v4
        with:
          path: piezas
          merge-multiple: true
      - name: Montar la imagen
        run: |
          gunzip -kf Lakka-Generic.x86_64-${LAKKA_VERSION}.img.gz
          ls -la piezas
          sudo bash lakka/imagen/construir.sh Lakka-Generic.x86_64-${LAKKA_VERSION}.img piezas pokemulador-usb.img
          sudo chown $(id -u) pokemulador-usb.img
          gzip -9 -k pokemulador-usb.img
          ls -la pokemulador-usb.img*
      - uses: actions/upload-artifact@v4
        with:
          name: pokemulador-usb
          path: pokemulador-usb.img.gz
          compression-level: 0
          retention-days: 14

  prueba-escritorio:
    name: Prueba de la pantalla de salas (RetroArch de escritorio)
    needs: [ programas ]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq retroarch libretro-gambatte xvfb xdotool imagemagick netcat-openbsd libgl1-mesa-dri > /dev/null
      - uses: actions/download-artifact@v4
        with:
          name: lakka-programas
          path: piezas
      - name: Probar
        env:
          POKEMULADOR_TS_KEY: ${{ secrets.POKEMULADOR_TS_KEY }}
        run: bash lakka/prueba/escritorio.sh piezas resultado
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-escritorio
          path: resultado/
          retention-days: 7

  prueba:
    name: Prueba en una máquina virtual (${{ matrix.grafica }})
    needs: [ imagen ]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        grafica: [ std, virtio ]
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf exfatprogs gdisk > /dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules > /dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: pokemulador-usb
      - name: Preparar un USB de prueba (con parte JUEGOS y un juego de prueba)
        run: |
          gunzip -f pokemulador-usb.img.gz
          truncate -s +1G pokemulador-usb.img
          sgdisk -e pokemulador-usb.img > /dev/null
          sgdisk -n 3:0:0 -t 3:0700 -c 3:JUEGOS pokemulador-usb.img > /dev/null
          dev=$(sudo losetup -fP --show pokemulador-usb.img)
          sudo mkfs.exfat -L JUEGOS ${dev}p3 > /dev/null
          mkdir -p p1 p3
          sudo mount ${dev}p3 p3
          python3 lakka/prueba/rom_prueba.py prueba.gb && sudo cp prueba.gb "p3/Juego de prueba.gb"
          sudo umount p3
          # Mensajes del arranque por el puerto serie
          sudo mount ${dev}p1 p1
          sudo sed -i 's#grub_portable quiet#grub_portable console=ttyS0,115200 console=tty0#' p1/EFI/BOOT/grub.cfg
          sudo umount p1
          sudo losetup -d $dev
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
      - name: Arrancar y probar
        run: |
          mkdir -p resultado
          qemu-system-x86_64 -enable-kvm -machine q35 -cpu host -smp 2 -m 3072 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -device qemu-xhci -drive if=none,id=usb,format=raw,file=pokemulador-usb.img \
            -device usb-storage,drive=usb,removable=on -device usb-kbd \
            $( [ "${{ matrix.grafica }}" = virtio ] && echo "-vga none -device virtio-vga" || echo "-vga std" )             -display none -audiodev none,id=nada \
            -netdev user,id=red -device e1000,netdev=red \
            -qmp unix:qmp.sock,server,nowait -serial file:resultado/serie.txt &
          Q="python3 lakka/prueba/qmp.py qmp.sock"
          sleep 100; $Q captura resultado/1-inicio.png
          $Q teclas x; sleep 3; $Q captura resultado/2-juegos.png
          $Q teclas x; sleep 3; $Q captura resultado/3-partida.png
          $Q teclas x; sleep 30; $Q captura resultado/4-sala.png
          $Q teclas x; sleep 20; $Q captura resultado/5-juego.png
          $Q teclas f1; sleep 5; $Q captura resultado/6-menu.png
          $Q apagar; sleep 40
          pkill -f qemu-system || true
      - name: Registros del USB de prueba
        if: always()
        run: |
          dev=$(sudo losetup -fP --show pokemulador-usb.img)
          mkdir -p p2 && sudo mount ${dev}p2 p2
          sudo ls -la p2 p2/pokemulador || true
          for f in registro.txt retroarch.txt salas.json jugador.json; do echo "== $f"; sudo cat p2/pokemulador/$f 2>/dev/null | tail -80; done
          sudo mkdir -p resultado/datos
          sudo cp p2/pokemulador/*.txt p2/pokemulador/*.json resultado/datos/ 2>/dev/null || true
          sudo chown -R $(id -u) resultado
          sudo umount p2; sudo losetup -d $dev
          tail -60 resultado/serie.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-usb-${{ matrix.grafica }}
          path: resultado/
          retention-days: 7
