name: Compilar APK

# Compila Pokemulador para Android cada vez que se sube un cambio a una rama que no sea master
# (master sigue al Lemuroid original). Tres piezas:
#   1. El núcleo de 3DS: Azahar con las salas de Pokemulador (nucleos/azahar). Tarda mucho,
#      así que se guarda en caché y solo se recompila si cambian esos archivos.
#   2. El núcleo de GBA: mGBA con scripts de Lua para la partida compartida (nucleos/mgba).
#      Sale para Android y para Windows (el de Windows va en el instalador de PC).
#   3. El enlace online (pc/enlace, Go + Tailscale), compilado para Android.
#   4. La app, con la clave de Tailscale sacada del secreto POKEMULADOR_TS_KEY.
on:
  push:
    branches-ignore: [ master ]
  workflow_dispatch:

env:
  AZAHAR_TAG: "2126.2"
  MGBA_TAG: "0.10.5"
  LUA_VERSION: "5.4.7"
  ANDROID_NDK_VERSION: "29.0.14206865"

jobs:
  nucleo-azahar:
    name: Núcleo 3DS (Azahar con salas)
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Buscar núcleo ya compilado
        id: cache
        uses: actions/cache@v4
        with:
          path: nucleo/libcitra_libretro_android.so
          key: nucleo-azahar-${{ env.AZAHAR_TAG }}-${{ hashFiles('nucleos/azahar/**') }}

      - name: Descargar Azahar
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: azahar-emu/azahar
          ref: ${{ env.AZAHAR_TAG }}
          submodules: recursive
          path: azahar

      - name: Añadir salas y compilar el núcleo
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 nucleos/azahar/aplicar.py azahar
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "ndk;$ANDROID_NDK_VERSION" "cmake;3.30.3" > /dev/null
          NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/$ANDROID_NDK_VERSION
          CMAKE=${ANDROID_SDK_ROOT}/cmake/3.30.3/bin/cmake
          cd azahar
          $CMAKE -DENABLE_LIBRETRO=ON -DANDROID_PLATFORM=android-21 \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_STL=c++_static -DANDROID_ABI=arm64-v8a . -B build
          $CMAKE --build build --target azahar_libretro --config Release -j $(nproc)
          SO=$(find build -name 'azahar_libretro*.so' | head -1)
          echo "Núcleo: $SO"
          $NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip -s "$SO"
          mkdir -p ../nucleo
          cp "$SO" ../nucleo/libcitra_libretro_android.so

      - name: Guardar núcleo
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-azahar
          path: nucleo/libcitra_libretro_android.so
          retention-days: 7

  nucleo-mgba:
    name: Núcleo GBA (mGBA con partida compartida)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Buscar núcleos ya compilados
        id: cache
        uses: actions/cache@v4
        with:
          path: nucleo-mgba
          key: nucleo-mgba-${{ env.MGBA_TAG }}-${{ env.LUA_VERSION }}-${{ hashFiles('nucleos/mgba/**') }}

      - name: Descargar mGBA
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: mgba-emu/mgba
          ref: ${{ env.MGBA_TAG }}
          path: mgba

      - name: Compilar para Android y Windows
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash nucleos/mgba/compilar.sh

      - name: Guardar núcleos
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-mgba
          path: nucleo-mgba/
          retention-days: 30

  apk:
    name: APK de prueba
    needs: [nucleo-azahar, nucleo-mgba]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: actions/setup-go@v5
        with:
          go-version-file: pc/enlace/go.mod
          cache-dependency-path: pc/enlace/go.sum

      - name: Traer el núcleo de Azahar
        uses: actions/download-artifact@v4
        with:
          name: nucleo-azahar
          path: nucleo

      - name: Traer el núcleo de mGBA
        uses: actions/download-artifact@v4
        with:
          name: nucleo-mgba
          path: nucleo-mgba

      - name: Poner mGBA con scripts en lugar del de Lemuroid
        run: |
          cp --remove-destination nucleo-mgba/libmgba_libretro_android.so \
            lemuroid-cores/bundled-cores/src/main/jniLibs/arm64-v8a/libmgba_libretro_android.so
          ls -la lemuroid-cores/bundled-cores/src/main/jniLibs/arm64-v8a/libmgba_libretro_android.so

      - name: Poner Azahar en lugar del núcleo antiguo de 3DS
        run: |
          cp --remove-destination nucleo/libcitra_libretro_android.so \
            lemuroid-cores/bundled-cores/src/main/jniLibs/arm64-v8a/libcitra_libretro_android.so
          ls -la lemuroid-cores/bundled-cores/src/main/jniLibs/arm64-v8a/libcitra_libretro_android.so

      - name: Compilar el enlace online para Android
        working-directory: pc/enlace
        run: |
          mkdir -p ../../lemuroid-app/src/main/jniLibs/arm64-v8a
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" \
            -o ../../lemuroid-app/src/main/jniLibs/arm64-v8a/libenlace.so .

      - name: Compilar la app
        env:
          POKEMULADOR_TS_KEY: ${{ secrets.POKEMULADOR_TS_KEY }}
        run: |
          if [ -z "$POKEMULADOR_TS_KEY" ]; then echo "::warning::Sin secreto POKEMULADOR_TS_KEY: la app no podrá jugar online"; fi
          chmod +x gradlew
          ./gradlew assembleFreeBundleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-prueba
          path: lemuroid-app/build/outputs/apk/freeBundle/debug/*.apk
          retention-days: 30
