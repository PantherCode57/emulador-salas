# Ajustes de RetroArch que aplica Pokemulador encima de la configuración normal.
# Se copia a emuladores/RetroArch/pokemulador.cfg y se pasa con --appendconfig.
menu_driver = "ozone"
user_language = "3"
pause_nonactive = "false"
savestate_auto_save = "true"
savestate_auto_load = "true"
menu_show_core_updater = "false"
menu_show_online_updater = "false"
# Esc sale del juego a la primera (la partida se guarda sola al salir).
quit_press_twice = "false"
# Además de F1, mantener pulsado Start (Intro en el teclado) 2 segundos abre el menú.
input_menu_toggle_gamepad_combo = "7"
